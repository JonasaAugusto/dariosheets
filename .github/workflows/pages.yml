# Publica o site no GitHub Pages a cada push na main.
#
# Existe porque o site deixou de ser HTML solto e passou a ter build. Sem
# isto, publicar dependeria de alguém lembrar de rodar `npm run build` e
# commitar o `dist/` — e "alguém lembrar" é o tipo de passo que falha na
# terceira semana, em silêncio, com o site velho no ar.
name: Publicar no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Dois em paralelo publicariam fora de ordem, e o mais
# antigo poderia ser o último a chegar.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
