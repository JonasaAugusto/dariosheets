<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f6">
<meta name="description" content="Preços do frete: edite a tabela do robô Dário pelo celular.">
<meta name="mobile-web-app-capable" content="yes">
<title>Preços do Frete</title>
<link rel="manifest" href="/manifest.json">
<!--
  Favicon em SVG, traço, sem emoji.
  Emoji tem desenho diferente em cada aparelho e não aceita cor: nunca foi
  ícone, só parecia. Este é o caminhão do Lucide, inline pra não custar
  requisição.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a6212' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2'/%3E%3Cpath d='M15 18H9'/%3E%3Cpath d='M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14'/%3E%3Ccircle cx='17' cy='18' r='2'/%3E%3Ccircle cx='7' cy='18' r='2'/%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
  <!--
    CSP: se um dia uma dependência do build for comprometida, ou algo
    injetar script na página, isto limita o estrago. Só carrega script
    daqui e do Google, só conecta com o Google e a própria origem. O
    token do OAuth (~1h de validade) não pode ser mandado escondido pra
    um domínio de fora.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
